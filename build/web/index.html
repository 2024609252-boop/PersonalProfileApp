```html
<!DOCTYPE html>
<html>

<head>

<title>Personal Profile Form</title>

<style>

body{
    font-family: Arial;
    background:#f2f2f2;
}

.container{
    width:50%;
    margin:auto;
    background:white;
    padding:30px;
    margin-top:40px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
}

h1{
    text-align:center;
    color:#333;
}

input, textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    background:#007bff;
    color:white;
    padding:10px 20px;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

</style>

</head>

<body>

<div class="container">

<h1>Personal Profile Form</h1>

<form action="ProfileServlet" method="post">

<label>Name</label>
<input type="text" name="name" required>

<label>Student ID</label>
<input type="text" name="studentId" required>

<label>Program</label>
<input type="text" name="program" required>

<label>Email</label>
<input type="email" name="email" required>

<label>Hobbies</label>
<input type="text" name="hobbies">

<label>Self Introduction</label>
<textarea name="intro" rows="5"></textarea>

<button type="submit">
Submit Profile
</button>

</form>

</div>

</body>

</html>
